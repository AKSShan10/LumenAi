# Alembic settings. Alembic keeps the database tables in step with the models.
# The database address is NOT written here: migrations/env.py takes it from the app settings (.env).
[alembic]
script_location = migrations
# Lets the migration files import the app (from app.core ...) when Alembic is started in this folder.
prepend_sys_path = .
path_separator = os
# New migration files get a date in front of the name, so they sort in the order they were made.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
