server {
    listen 80;
    client_max_body_size 6m;      # uploaded files may be up to 5 MB (the default limit is 1 MB)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # The live transcript: each browser's microphone comes as a WebSocket (/api/sessions/<id>/stt, /api/join/<token>/stt)
    location ~ ^/api/(sessions|join)/[^/]+/stt$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;                 # the line stays open for the whole call
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # also serves /join/<link> to the React app
    }
}
