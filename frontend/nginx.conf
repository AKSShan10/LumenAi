server {
    listen 80;
    client_max_body_size 6m;      # uploaded files may be up to 5 MB (the default limit is 1 MB)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # The video call's LiveKit server in Docker (LIVEKIT_URL=/): the browser opens a WebSocket at /rtc on this
    # same address. The name is looked up when a call starts (resolver = Docker's DNS), so nginx also starts
    # when the livekit service is not running (LiveKit Cloud).
    location /rtc {
        resolver 127.0.0.11 valid=30s;
        set $livekit http://livekit:7880;
        proxy_pass $livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;                 # a WebSocket stays open for the whole call
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # also serves /join/<link> to the React app
    }
}
