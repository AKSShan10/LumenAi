<rect x="30" y="96" width="1560" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="38" y="36.0" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937">LangGraph 4 · Assessment report</text>
<text x="38" y="70.2" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">The final report: parallel steps, a repair loop and the overall score.</text>
<text x="50" y="121.8" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Assessment report (F6)</text>
<text x="50" y="149.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">One run per candidate. Four steps at the</text>
<text x="50" y="163.8" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">same time; every item must quote the CV or</text>
<text x="50" y="178.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">the candidate&#x27;s answers. Unproven items go</text>
<text x="50" y="193.2" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">back to the AI at most twice, then are</text>
<text x="50" y="207.9" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">removed. Overall score by code; the</text>
<text x="50" y="222.6" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">interviewer records hire, hold or reject.</text>
