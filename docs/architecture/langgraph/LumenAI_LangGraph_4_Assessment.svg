<text x="38" y="445.8" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">CV claim check (F8) is plain Python steps in claim_service.py (Step 1 to 5): a straight line with no pause, loop or parallel steps, so LangGraph is not used there.</text>
