<svg xmlns="http://www.w3.org/2000/svg" width="2044" height="634" viewBox="0 0 2044 634" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="2044" height="634" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect x="30" y="96" width="1984" height="404" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="38" y="36.0" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937">LangGraph 3 · Q&amp;A analysis and scorecard</text>
<text x="38" y="70.2" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">After the interview: six graders in parallel, then the scorecard by code.</text>
<text x="50" y="121.8" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Q&amp;A analysis + scorecard (F9)</text>
<text x="50" y="149.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">One run per interview. The AI pairs</text>
<text x="50" y="163.8" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">questions and answers by line number; code</text>
<text x="50" y="178.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">copies the candidate&#x27;s words. Six graders</text>
<text x="50" y="193.2" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">run at the same time (fan-out),</text>
<text x="50" y="207.9" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">merge_evaluation waits for all six</text>
<text x="50" y="222.6" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">(fan-in). Each grader writes its own state</text>
<text x="50" y="237.4" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">field, so no reducers.</text>
<rect x="350" y="278.0" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="425.0" y="301.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">load_transcript</text>
<rect x="562" y="278.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="637.0" y="301.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">segment_qa_pairs</text>
<rect x="774" y="278.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="849.0" y="301.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">classify_requirements</text>
<rect x="986" y="148.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="1061.0" y="171.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">relevance</text>
<rect x="986" y="200.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="1061.0" y="223.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">accuracy (+RAG)</text>
<rect x="986" y="252.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="1061.0" y="275.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">completeness</text>
<rect x="986" y="304.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="1061.0" y="327.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">articulation</text>
<rect x="986" y="356.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="1061.0" y="379.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">problem_solving</text>
<rect x="986" y="408.0" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="1061.0" y="431.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">depth</text>
<rect x="1198" y="278.0" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1273.0" y="301.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">merge_evaluation</text>
<rect x="1410" y="278.0" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1485.0" y="301.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">detect_requirement_gaps</text>
<rect x="1622" y="278.0" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1697.0" y="301.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">build_scorecard</text>
<rect x="1834" y="252.0" width="150" height="40" rx="20.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="1909.0" y="275.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">save</text>
<rect x="1834" y="304.0" width="150" height="40" rx="20.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="1909.0" y="327.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">failed</text>
<rect x="30" y="532" width="1984" height="28" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text x="38" y="549.8" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">Interview quality (F10) runs after this as plain Python steps in interview_quality_service.py (Step 1 to 8): only one step is AI, so LangGraph is not used there.</text>
<rect x="30" y="578" width="22" height="14" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="66" y="588.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">Python code</text>
<rect x="320" y="578" width="22" height="14" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="356" y="588.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">AI step</text>
<rect x="610" y="578" width="22" height="14" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="646" y="588.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">PAUSE: interrupt, a person answers</text>
<rect x="900" y="578" width="22" height="14" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
<text x="936" y="588.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">Outside service</text>
<rect x="1190" y="578" width="22" height="14" rx="7.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="1226" y="588.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">End of the run</text>
<text x="38" y="611.5" font-size="11" text-anchor="start" font-weight="normal" fill="#4b5563">Purple dashed = loop back · grey dashed = skip ahead · red dashed = to failed · blue dashed box = the run pauses until a person answers</text>
