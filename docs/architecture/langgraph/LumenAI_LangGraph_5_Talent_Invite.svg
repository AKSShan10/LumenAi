<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="377" viewBox="0 0 1408 377" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1408" height="377" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect x="30" y="96" width="1348" height="181" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="38" y="36.0" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937">LangGraph 5 · Talent invite</text>
<text x="38" y="70.2" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">Inviting a past candidate to a new job: the AI drafts, code checks, a person sends.</text>
<text x="50" y="121.8" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Talent invite (F11)</text>
<text x="50" y="149.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">One run per person. The AI never sees</text>
<text x="50" y="163.8" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">scores, decisions or the address. Code</text>
<text x="50" y="178.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">checks the draft; one retry, then the</text>
<text x="50" y="193.2" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">standard text. Write again (+ change) is a</text>
<text x="50" y="207.9" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">new run that gets the draft on the page and</text>
<text x="50" y="222.6" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">the change (Shorter / Very short). A person</text>
<text x="50" y="237.4" font-size="11.5" text-anchor="start" font-weight="normal" fill="#374151">sends.</text>
<rect x="350" y="166.5" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="425.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">load_facts</text>
<rect x="562" y="166.5" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="637.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">write_draft</text>
<rect x="774" y="166.5" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="849.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">check_draft</text>
<rect x="986" y="166.5" width="150" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1061.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">standard_text</text>
<rect x="1198" y="166.5" width="150" height="40" rx="20.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="1273.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937">finish</text>
<rect x="30" y="321" width="22" height="14" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="66" y="331.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">Python code</text>
<rect x="320" y="321" width="22" height="14" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="356" y="331.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">AI step</text>
<rect x="610" y="321" width="22" height="14" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="646" y="331.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">PAUSE: interrupt, a person answers</text>
<rect x="900" y="321" width="22" height="14" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
<text x="936" y="331.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">Outside service</text>
<rect x="1190" y="321" width="22" height="14" rx="7.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="1226" y="331.5" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">End of the run</text>
<text x="38" y="354.5" font-size="11" text-anchor="start" font-weight="normal" fill="#4b5563">Purple dashed = loop back · grey dashed = skip ahead · red dashed = to failed · blue dashed box = the run pauses until a person answers</text>
<path d="M500.0 186.5 L562.0 186.5" fill="none" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M712.0 186.5 L774.0 186.5" fill="none" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M849.0 166.5 L849.0 150.5 L637.0 150.5 L637.0 166.5" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M924.0 186.5 L986.0 186.5" fill="none" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M1136.0 186.5 L1198.0 186.5" fill="none" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M849.0 206.5 L849.0 226.5 L1273.0 226.5 L1273.0 206.5" fill="none" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<rect x="709.0" y="141.5" width="68" height="16" fill="#ffffff"/><text x="743.0" y="153.5" font-size="11" text-anchor="middle" fill="#4b5563">retry once</text>
<rect x="918.0" y="177.5" width="74" height="16" fill="#ffffff"/><text x="955.0" y="189.5" font-size="11" text-anchor="middle" fill="#4b5563">fails twice</text>
<rect x="1051.0" y="217.5" width="20" height="16" fill="#ffffff"/><text x="1061.0" y="229.5" font-size="11" text-anchor="middle" fill="#4b5563">ok</text>
</svg>